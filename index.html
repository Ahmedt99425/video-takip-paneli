<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./assets/icon.svg"><title>Video Takip Paneli</title><link rel="stylesheet" href="./style.css"></head><body><header><b>🎬 Video Takip Paneli</b><button id="logout" class="hidden">Çıkış</button></header><section id="auth" class="card"><h2>Hesabına giriş yap</h2><input id="email" type="email" placeholder="E-posta"><input id="password" type="password" placeholder="Şifre (en az 8 karakter)"><button id="login">Giriş yap</button><button id="register">Hesap oluştur</button><p id="authMsg"></p></section><main id="app" class="hidden"><div class="stats"><div class="card">Planlanan <b id="pc">0</b></div><div class="card">Paylaşılan <b id="dc">0</b></div></div><nav><button data-tab="videos">Videolar</button><button data-tab="tasks">Yapılacaklar</button><button data-tab="notes">Notlar</button></nav><section id="videos"><h2>Video ekle</h2><form id="vf" class="card"><input id="vid" type="hidden"><label>Platform<select id="platform"><option>Instagram</option><option>TikTok</option><option>Facebook</option></select></label><label>Hesap<input id="account" required></label><label>Film / video adı<input id="film" required></label><label>Video başlığı<input id="title"></label><label>Açıklama<textarea id="description"></textarea></label><label>Tarih<input id="date" type="date"></label><label>Saat<input id="time" type="time"></label><label>Durum<select id="status"><option value="planned">Planlandı</option><option value="published">Paylaşıldı</option></select></label><button>Kaydet</button></form><h2>Videolarım</h2><div id="vl"></div></section><section id="tasks" class="hidden"><h2>Yapılacaklar</h2><form id="tf" class="card"><input id="taskText" required placeholder="Görev"><input id="taskDate" type="date"><button>Ekle</button></form><div id="tl"></div></section><section id="notes" class="hidden"><h2>Notlarım</h2><form id="nf" class="card"><input id="nid" type="hidden"><input id="nt" required placeholder="Not başlığı"><textarea id="nb" placeholder="Not içeriği"></textarea><button>Notu kaydet</button></form><div id="nl"></div></section><p id="msg"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script src="./app.js"></script><script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script></body></html>
